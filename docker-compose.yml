services:
  safaeewala-booking-crm:
    container_name: safaeewala-booking-crm
    build:
      context: .
      dockerfile: Dockerfile
    image: safaeewala-booking-crm:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./data:/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.safaeewala-crm.rule=Host(`crm.srv1646539.hstgr.cloud`) || Host(`safaeewala.srv1646539.hstgr.cloud`)"
      - "traefik.http.routers.safaeewala-crm.entrypoints=websecure"
      - "traefik.http.routers.safaeewala-crm.tls.certresolver=letsencrypt"
      - "traefik.http.services.safaeewala-crm.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - safaeewala-net

networks:
  safaeewala-net:
    name: safaeewala_network
    driver: bridge
