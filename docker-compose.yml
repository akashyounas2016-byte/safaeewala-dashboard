services:
  safaeewala-booking-crm:
    container_name: safaeewala-booking-crm
    build:
      context: .
      dockerfile: Dockerfile
    image: safaeewala-booking-crm:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./data:/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - safaeewala-net

networks:
  safaeewala-net:
    name: safaeewala_network
    driver: bridge
