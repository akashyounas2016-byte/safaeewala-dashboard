name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS deploy
        run: |
          curl -s -X POST http://187.77.116.14:9000/deploy \
            -H "X-Secret: ${{ secrets.WEBHOOK_SECRET }}" \
            --max-time 30 \
            && echo "Deploy triggered successfully" \
            || echo "Webhook call failed"
