name: Android test app (APK)

# R-APP-01: builds the Safaeewala Duties test app (debug APK) on GitHub — no Android Studio on the office PC.
# The APK opens the live CRM (crm.safaeewala.com/my-duties), so website deploys reach the app without a new APK;
# a new APK is only needed when the app itself changes (android/, capacitor.config.ts, app-shell/).
# Download: GitHub → Releases → "Safaeewala Duties — test build N" → app-debug.apk (or the run's artifact).

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'app-shell/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write # the APK is attached to a pre-release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # the ubuntu runner already has the Android SDK (ANDROID_HOME); Gradle fetches a missing platform itself
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Sync the Capacitor project
        run: npx cap sync android

      # R-APP-02: the fixed signing key (if the owner added the secrets), so updates install over the old app
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/safaeewala.p12"; echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/safaeewala.p12" >> "$GITHUB_ENV"; echo "fixed key"; else echo "no secret: debug key"; fi

      - name: Build the debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk "../safaeewala-duties-test-${{ github.run_number }}.apk"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: safaeewala-duties-test-${{ github.run_number }}
          path: safaeewala-duties-test-${{ github.run_number }}.apk

      - name: Publish as a pre-release (easy download on a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-${{ github.run_number }}
          name: Safaeewala Duties — test build ${{ github.run_number }}
          prerelease: true
          body: |
            Test app for cleaners / drivers (R-APP-01). Install: open this file on the Android phone → allow "Install unknown apps" → Install.
            Log in with the CRM login. My Duties → Share my location: works with the screen off (a notification shows while sharing).
            Commit ${{ github.sha }}.
          files: safaeewala-duties-test-${{ github.run_number }}.apk
